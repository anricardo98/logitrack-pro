server:
  port: 8080

spring:
  application:
    name: logitrack-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/logitrack}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate          # o schema é responsabilidade do Flyway
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: America/Sao_Paulo
    serialization:
      write-dates-as-timestamps: false

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  writer-with-order-by-keys: true
  # as respostas de erro são declaradas em cada rota (@ApiResponse), não herdadas do GlobalExceptionHandler
  override-with-generic-response: false

app:
  admin:
    email: ${ADMIN_EMAIL:admin@logitrack.com}
    senha: ${ADMIN_SENHA:admin123}
  jwt:
    secret: ${JWT_SECRET:troque-esta-chave-em-producao-com-32+caracteres}
    validade-horas: 8
  cors:
    origens: ${CORS_ORIGENS:http://localhost:5173}
